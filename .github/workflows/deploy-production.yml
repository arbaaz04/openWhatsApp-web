name: Deploy Production
on:
  push:
    branches:
      - production

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint

  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  test:
    name: Tests
    runs-on: ubuntu-24.04
    needs: [lint]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx vitest run --reporter=verbose --coverage

  deploy:
    runs-on: ubuntu-24.04
    needs: [lint, audit, test]
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Backend Deploy Preflight
        working-directory: ./backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          META_APP_ID: ${{ vars.META_APP_ID }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          WEBHOOK_VERIFY_TOKEN: ${{ secrets.WEBHOOK_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          set -euo pipefail

          for name in ALLOWED_ORIGIN SUPABASE_URL META_APP_ID ENVIRONMENT; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Environment variable (production): $name"
              exit 1
            fi
          done

          if [ "${ENVIRONMENT}" != "production" ]; then
            echo "ENVIRONMENT must be production for production deploys"
            exit 1
          fi

          if echo "$ALLOWED_ORIGIN" | grep -qi 'localhost'; then
            echo "ALLOWED_ORIGIN must not point to localhost in production"
            exit 1
          fi

          for name in SUPABASE_JWT_SECRET DATA_ENCRYPTION_KEY WEBHOOK_VERIFY_TOKEN META_APP_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Environment secret (production): $name"
              exit 1
            fi
          done

          npx wrangler whoami >/dev/null

      - name: Sync Runtime Config to Cloudflare (Production)
        working-directory: ./backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          WEBHOOK_VERIFY_TOKEN: ${{ secrets.WEBHOOK_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_JWT_SECRET" | npx wrangler secret put SUPABASE_JWT_SECRET --env production
          printf '%s' "$DATA_ENCRYPTION_KEY" | npx wrangler secret put DATA_ENCRYPTION_KEY --env production
          printf '%s' "$WEBHOOK_VERIFY_TOKEN" | npx wrangler secret put WEBHOOK_VERIFY_TOKEN --env production
          printf '%s' "$META_APP_SECRET" | npx wrangler secret put META_APP_SECRET --env production

      # Deploy Backend via Wrangler
      - name: Deploy Backend
        working-directory: ./backend
        run: |
          set -euo pipefail
          npx wrangler deploy --env production \
            --var ALLOWED_ORIGIN:${{ vars.ALLOWED_ORIGIN }} \
            --var SUPABASE_URL:${{ vars.SUPABASE_URL }} \
            --var META_APP_ID:${{ vars.META_APP_ID }} \
            --var ENVIRONMENT:${{ vars.ENVIRONMENT }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Deploy Frontend via Pages
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
      - name: Deploy Frontend
        working-directory: ./frontend
        run: npx wrangler pages deploy dist --project-name whatflow-frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
