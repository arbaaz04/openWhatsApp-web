name: Deploy Production
on:
  push:
    branches:
      - production

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --no-audit --legacy-peer-deps
      - run: npm run lint

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit
      - run: npm run lint

  backend-audit:
    name: Backend Security Audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --no-audit --legacy-peer-deps
      - run: npm audit --audit-level=high

  frontend-audit:
    name: Frontend Security Audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit
      - run: npm audit --audit-level=high

  test:
    name: Tests
    runs-on: ubuntu-24.04
    needs: [backend-lint]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --no-audit --legacy-peer-deps
      - run: npx vitest run --reporter=verbose --coverage

  deploy:
    runs-on: ubuntu-24.04
    needs: [backend-lint, backend-audit, test]
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check for DB changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            db:
              - 'backend/src/db/**'
              - 'backend/drizzle/**'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: |
          cd backend
          npm install --no-audit --legacy-peer-deps

      - name: Backend Deploy Preflight
        working-directory: ./backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          META_APP_ID: ${{ vars.META_APP_ID }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          WEBHOOK_VERIFY_TOKEN: ${{ secrets.WEBHOOK_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          set -euo pipefail

          for name in ALLOWED_ORIGIN SUPABASE_URL META_APP_ID ENVIRONMENT; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Environment variable (production): $name"
              exit 1
            fi
          done

          if [ "${ENVIRONMENT}" != "production" ]; then
            echo "ENVIRONMENT must be production for production deploys"
            exit 1
          fi

          if echo "$ALLOWED_ORIGIN" | grep -qi 'localhost'; then
            echo "ALLOWED_ORIGIN must not point to localhost in production"
            exit 1
          fi

          for name in SUPABASE_JWT_SECRET DATA_ENCRYPTION_KEY WEBHOOK_VERIFY_TOKEN META_APP_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Environment secret (production): $name"
              exit 1
            fi
          done

          if [ "${{ steps.filter.outputs.db }}" == "true" ] && [ -z "${DIRECT_DATABASE_URL:-}" ]; then
            echo "Changes detected in DB files but DIRECT_DATABASE_URL secret is missing."
            echo "Please add DIRECT_DATABASE_URL to GitHub Secrets to enable migrations."
            exit 1
          fi

          npx wrangler whoami >/dev/null

      - name: Apply Database migrations (Production)
        if: steps.filter.outputs.db == 'true'
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npx tsx src/scripts/sync-db.ts

      - name: Sync Runtime Config to Cloudflare (Production)
        working-directory: ./backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          WEBHOOK_VERIFY_TOKEN: ${{ secrets.WEBHOOK_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_JWT_SECRET" | npx wrangler secret put SUPABASE_JWT_SECRET --env production
          printf '%s' "$DATA_ENCRYPTION_KEY" | npx wrangler secret put DATA_ENCRYPTION_KEY --env production
          printf '%s' "$WEBHOOK_VERIFY_TOKEN" | npx wrangler secret put WEBHOOK_VERIFY_TOKEN --env production
          printf '%s' "$META_APP_SECRET" | npx wrangler secret put META_APP_SECRET --env production

      - name: Patch Custom Domains (Production)
        working-directory: ./backend
        run: |
          sed -i 's/PROD_BACKEND_HOST/${{ vars.APP_BACKEND_URL }}/g' wrangler.json

      - name: Deploy Backend
        working-directory: ./backend
        run: |
          set -euo pipefail
          npx wrangler deploy --env production \
            --var ALLOWED_ORIGIN:https://${{ vars.APP_FRONTEND_URL }} \
            --var SUPABASE_URL:${{ vars.SUPABASE_URL }} \
            --var META_APP_ID:${{ vars.META_APP_ID }} \
            --var ENVIRONMENT:${{ vars.ENVIRONMENT }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend (Production)
    runs-on: ubuntu-24.04
    needs: [frontend-lint, frontend-audit]
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend
          npm install --no-audit

      - name: Build Frontend
        working-directory: ./frontend
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: https://${{ vars.APP_BACKEND_URL }}
          VITE_META_APP_ID: ${{ vars.META_APP_ID }}
          VITE_META_CONFIG_ID: ${{ vars.VITE_META_CONFIG_ID }}
        run: npm run build

      - name: Sync Runtime Config to Cloudflare (Production)
        working-directory: ./frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$VITE_SUPABASE_ANON_KEY" | npx wrangler secret put VITE_SUPABASE_ANON_KEY --env production

      - name: Patch Custom Domains (Production)
        working-directory: ./frontend
        run: |
          sed -i 's/PROD_FRONTEND_HOST/${{ vars.APP_FRONTEND_URL }}/g' wrangler.json

      - name: Deploy Frontend
        working-directory: ./frontend
        run: |
          set -euo pipefail
          npx wrangler deploy --env production \
            --var SUPABASE_URL:${{ vars.SUPABASE_URL }} \
            --var META_APP_ID:${{ vars.META_APP_ID }} \
            --var VITE_META_CONFIG_ID:${{ vars.VITE_META_CONFIG_ID }} \
            --var ENVIRONMENT:${{ vars.ENVIRONMENT }} \
            --var APP_BACKEND_URL:https://${{ vars.APP_BACKEND_URL }} \
            --var APP_FRONTEND_URL:https://${{ vars.APP_FRONTEND_URL }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
