name: Deploy Development

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --no-audit --legacy-peer-deps
      - run: npm run lint

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit
      - run: npm run lint

  backend-audit:
    name: Backend Security Audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --no-audit --legacy-peer-deps
      - run: npm audit --audit-level=high

  frontend-audit:
    name: Frontend Security Audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --no-audit
      - run: npm audit --audit-level=high

  test:
    name: Tests
    runs-on: ubuntu-24.04
    needs: [backend-lint]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --no-audit --legacy-peer-deps
      - run: npx vitest run --reporter=verbose --coverage

  deploy:
    name: Deploy Backend (Development)
    runs-on: ubuntu-24.04
    needs: [backend-lint, backend-audit, test]
    environment: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: |
          cd backend
          npm install --no-audit --legacy-peer-deps

      - name: Backend Deploy Preflight (Development)
        working-directory: ./backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ALLOWED_ORIGIN: ${{ vars.ALLOWED_ORIGIN }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          META_APP_ID: ${{ vars.META_APP_ID }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          WEBHOOK_VERIFY_TOKEN: ${{ secrets.WEBHOOK_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          DIRECT_DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: |
          set -euo pipefail

          for name in ALLOWED_ORIGIN SUPABASE_URL META_APP_ID ENVIRONMENT; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Environment variable (development): $name"
              exit 1
            fi
          done

          if [ "${ENVIRONMENT}" != "development" ]; then
            echo "ENVIRONMENT must be development for development deploys"
            exit 1
          fi

          for name in SUPABASE_JWT_SECRET DATA_ENCRYPTION_KEY WEBHOOK_VERIFY_TOKEN META_APP_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Environment secret (development): $name"
              exit 1
            fi
          done

          if [ -z "${DIRECT_DATABASE_URL:-}" ]; then
            echo "DIRECT_DATABASE_URL secret is missing."
            echo "Please add DIRECT_DATABASE_URL to GitHub Secrets to enable migrations."
            exit 1
          fi

          npx wrangler whoami >/dev/null

          npx wrangler queues list > queues.txt
          QUEUES="whatflow-web-webhooks-development whatflow-web-webhooks-dlq-development whatflow-web-user-webhooks-development whatflow-web-user-webhooks-dlq-development"
          for name in $QUEUES; do
            if ! grep -q "$name" queues.txt; then
              echo "Missing required development queue: $name"
              exit 1
            fi
          done

      - name: Apply Database migrations (Development)
        working-directory: ./backend
        env:
          DATABASE_URL: ${{ secrets.DIRECT_DATABASE_URL }}
        run: npm run db:migrate

      - name: Sync Runtime Config to Cloudflare (Development)
        working-directory: ./backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          WEBHOOK_VERIFY_TOKEN: ${{ secrets.WEBHOOK_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: |
          set -euo pipefail
          printf '%s' "$SUPABASE_JWT_SECRET" | npx wrangler secret put SUPABASE_JWT_SECRET --env development
          printf '%s' "$DATA_ENCRYPTION_KEY" | npx wrangler secret put DATA_ENCRYPTION_KEY --env development
          printf '%s' "$WEBHOOK_VERIFY_TOKEN" | npx wrangler secret put WEBHOOK_VERIFY_TOKEN --env development
          printf '%s' "$META_APP_SECRET" | npx wrangler secret put META_APP_SECRET --env development

      - name: Patch Custom Domains (Development)
        working-directory: ./backend
        run: |
          sed -i 's/DEV_BACKEND_HOST/${{ vars.APP_BACKEND_URL }}/g' wrangler.json

      - name: Deploy Backend
        working-directory: ./backend
        run: |
          set -euo pipefail
          npx wrangler deploy --env development \
            --var ALLOWED_ORIGIN:${{ vars.ALLOWED_ORIGIN }} \
            --var SUPABASE_URL:${{ vars.SUPABASE_URL }} \
            --var META_APP_ID:${{ vars.META_APP_ID }} \
            --var ENVIRONMENT:${{ vars.ENVIRONMENT }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-frontend:
    name: Deploy Frontend (Development)
    runs-on: ubuntu-24.04
    needs: [frontend-lint, frontend-audit]
    environment: development
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          cd frontend
          npm install --no-audit

      - name: Build Frontend
        working-directory: ./frontend
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: https://${{ vars.APP_BACKEND_URL }}
          VITE_META_APP_ID: ${{ vars.META_APP_ID }}
          VITE_META_CONFIG_ID: ${{ vars.VITE_META_CONFIG_ID }}
        run: npm run build

      - name: Sync Runtime Config to Cloudflare (Development)
        working-directory: ./frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$VITE_SUPABASE_ANON_KEY" | npx wrangler secret put VITE_SUPABASE_ANON_KEY --env development

      - name: Patch Custom Domains (Development)
        working-directory: ./frontend
        run: |
          sed -i 's/DEV_FRONTEND_HOST/${{ vars.APP_FRONTEND_URL }}/g' wrangler.json

      - name: Deploy Frontend
        working-directory: ./frontend
        run: |
          set -euo pipefail
          npx wrangler deploy --env development \
            --var SUPABASE_URL:${{ vars.SUPABASE_URL }} \
            --var META_APP_ID:${{ vars.META_APP_ID }} \
            --var VITE_META_CONFIG_ID:${{ vars.VITE_META_CONFIG_ID }} \
            --var ENVIRONMENT:${{ vars.ENVIRONMENT }} \
            --var APP_BACKEND_URL:https://${{ vars.APP_BACKEND_URL }} \
            --var APP_FRONTEND_URL:https://${{ vars.APP_FRONTEND_URL }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
