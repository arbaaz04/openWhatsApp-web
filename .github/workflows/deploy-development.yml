name: Deploy Development

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint

  audit:
    name: Security Audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high

  test:
    name: Tests
    runs-on: ubuntu-24.04
    needs: [lint]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx vitest run --reporter=verbose --coverage

  deploy:
    name: Deploy Backend (Development)
    runs-on: ubuntu-24.04
    needs: [lint, audit, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      - name: Backend Deploy Preflight (Development)
        working-directory: ./backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("wrangler.json", "utf8"));
            const dev = cfg.env && cfg.env.development;
            if (!dev || !dev.vars) {
              throw new Error("Missing env.development.vars in backend/wrangler.json");
            }
            const required = ["ALLOWED_ORIGIN", "SUPABASE_URL", "META_APP_ID", "ENVIRONMENT"];
            for (const key of required) {
              if (!dev.vars[key] || String(dev.vars[key]).trim() === "") {
                throw new Error(`Missing development var: ${key}`);
              }
            }
            if (String(dev.vars.ENVIRONMENT).toLowerCase() !== "development") {
              throw new Error("env.development.vars.ENVIRONMENT must be development");
            }
          '

          npx wrangler whoami >/dev/null
          npx wrangler secret list --env development > secrets.txt

          for name in SUPABASE_JWT_SECRET DATA_ENCRYPTION_KEY WEBHOOK_VERIFY_TOKEN META_APP_SECRET; do
            if ! grep -q "$name" secrets.txt; then
              echo "Missing required Cloudflare secret in development: $name"
              exit 1
            fi
          done

          npx wrangler queues list --json > queues.json
          node -e '
            const fs = require("fs");
            const queues = JSON.parse(fs.readFileSync("queues.json", "utf8"));
            const names = new Set(queues.map((q) => q.queue_name));
            for (const name of ["whatflow-webhooks-dev", "whatflow-webhooks-dlq-dev"]) {
              if (!names.has(name)) {
                throw new Error(`Missing required development queue: ${name}`);
              }
            }
          '

      - name: Deploy Backend
        working-directory: ./backend
        run: npx wrangler deploy --env development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
